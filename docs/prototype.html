<title>Prometeo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Concepto: centro de control oscuro. Barra superior con 4 vistas, panel de escenario fijo a la izquierda, vista activa a la derecha. */
:root{
  --bg:#fdfcf8; --surface:#fdfcf8; --surface2:#f2efe7; --line:#d9d5c9; --fg:#1b1b1b; --mut:#6a665c;
  --accent:#a3261e; --accent-ink:#ffffff; --cool:#2f5d8a;
  --ok:#2e6b4a; --warn:#8f5f00; --bad:#a3261e;
  --gA:#2e6b4a; --gB:#2f5d8a; --gC:#8f5f00; --gD:#8a8578;
  --display:"EB Garamond",Georgia,"Times New Roman",serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:700 18px var(--display);letter-spacing:-.01em}
.brand svg{flex:none}
.pack{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:3px 10px;display:flex;gap:6px;align-items:center}
.pack b{color:var(--fg);font-weight:500}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--mut);font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:12px}
.layout{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;margin-top:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;position:sticky;top:12px}
@media (max-width:900px){.side{position:static}}
h2{font:600 20px var(--display);margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
h3{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 10px;font-size:12px}
.chip:hover{border-color:var(--accent)}
.vcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--surface2)}
.vcard .row{display:flex;align-items:center;gap:8px}
.vcard .name{font-weight:600;flex:1}
.vcard .x{background:none;border:0;color:var(--mut);padding:2px 6px;font-size:16px;line-height:1}
.vcard .x:hover{color:var(--accent)}
.vcard input[type=range]{width:100%;accent-color:var(--accent);margin:8px 0 2px}
.num{width:76px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:3px 6px;text-align:right}
.sig{font-size:11px;color:var(--mut);display:flex;gap:6px;align-items:center}
.sig input{width:54px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 4px;text-align:right}
select.sel{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 6px;margin-top:6px}
.nodata{font-size:11px;color:var(--gC);margin-top:4px}
.addrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.addbox{border:1px dashed var(--line);border-radius:8px;padding:10px;margin-top:8px;display:grid;gap:6px}
.addbox input{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 7px;width:100%}
.note{font-size:12px;color:var(--mut)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.verdict{display:grid;gap:8px}
.verdict .big{font:600 28px/1.15 var(--display);letter-spacing:-.02em;text-wrap:balance}
.verdict .big em{font-style:normal;color:var(--accent)}
.gcount{display:flex;gap:10px;flex-wrap:wrap}
.gc{flex:1;min-width:110px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.gc b{font:600 26px var(--display);display:block}
.gc>span{font-size:12px;color:var(--mut)}
.badge{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;font:700 16px var(--display);border:1.5px solid currentColor;background:color-mix(in srgb,currentColor 14%,transparent);flex:none}
.grA{color:var(--gA)}.grB{color:var(--gB)}.grC{color:var(--gC)}.grD{color:var(--gD)}
.res{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px;text-align:left;width:100%}
.res:hover{border-color:var(--accent)}
.res .t{font-weight:600}
.res .sub{font-size:12px;color:var(--mut)}
.res .d{font-size:12px;color:var(--mut);text-align:right}
.res .why{grid-column:2/4;font-size:12.5px;color:var(--fg)}
.detail{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;margin-top:4px;display:grid;gap:10px;cursor:default}
.strips{display:grid;gap:8px}
.strip .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:3px}
.strip .track{position:relative;height:10px;background:var(--surface2);border-radius:5px}
.strip .band{position:absolute;top:0;height:10px;background:color-mix(in srgb,var(--accent) 55%,transparent);border-radius:5px;min-width:3px}
.strip .mark{position:absolute;top:-4px;width:3px;height:18px;background:var(--fg);border-radius:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.kv dt{color:var(--mut)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.heatwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:16px;align-items:start}
@media (max-width:1100px){.heatwrap{grid-template-columns:minmax(0,1fr)}}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:10px}
.ctrl label{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center}
.ctrl select{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px;color:var(--mut);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--fg);font-weight:600}
svg text{font-family:var(--body)}
.cellrect{cursor:pointer}
.cellrect:hover{stroke:var(--accent);stroke-width:2}
.reveal{border:1px solid var(--accent);border-radius:10px;padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));margin-bottom:12px}
.reveal b{color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.tlist{max-height:300px;overflow:auto;font-size:12px}
.tlist table{width:100%;border-collapse:collapse}
.tlist td,.tlist th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.gwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,280px);gap:16px;align-items:start}
@media (max-width:1100px){.gwrap{grid-template-columns:minmax(0,1fr)}}
.gsvg{width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;touch-action:none}
.glegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.back li{margin-bottom:4px;font-size:12.5px}
.back ul{padding-left:16px;margin:4px 0 10px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:start center;overflow:auto;padding:24px 16px;z-index:20}
.paper{background:#fbfbfa;color:#16191e;max-width:760px;width:100%;border-radius:6px;padding:32px 36px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.paper h1{font:700 24px var(--display);margin:0 0 2px}
.paper h4{font:600 13px var(--body);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 6px;color:#8a3a10}
.paper table{width:100%;border-collapse:collapse;font-size:12.5px}
.paper th,.paper td{border-bottom:1px solid #d9dde3;padding:4px 6px;text-align:left;vertical-align:top}
.paper p,.paper li{font-size:13px}
.paper .g{font:700 13px var(--display);border:1.5px solid #16191e;border-radius:4px;padding:0 6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:30;font-weight:500}
.empty{padding:30px;text-align:center;color:var(--mut)}
@media (prefers-reduced-motion:no-preference){.res,.chip,.btn{transition:border-color .15s}}
.rt{width:100%;border-collapse:collapse;font-size:13px}.rt th{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.rt td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rbar{display:inline-block;width:80px;height:8px;background:var(--surface2);border-radius:4px;vertical-align:middle;overflow:hidden}.rbar i{display:block;height:8px;background:var(--accent)}
.rlist{display:grid;gap:4px;max-height:520px;overflow:auto;padding-right:2px}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;text-align:left}
.rrow:hover{border-color:var(--accent)}.rrow[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rrow .badge{width:26px;height:26px;font-size:14px}.rn{display:flex;flex-direction:column;min-width:0}.rn small{color:var(--mut);font-size:11px}.glyph{display:block}

.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center;padding:48px 0 24px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr);padding-top:28px}}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 12px}
.hero h1{font:700 clamp(30px,4.600vw,52px)/1.05 var(--display);letter-spacing:-.03em;margin:0 0 16px;text-wrap:balance}
.lede{font-size:17px;color:var(--mut);max-width:52ch;margin:0 0 24px}
.ctas{display:flex;gap:10px;flex-wrap:wrap}
.btn.big{padding:12px 24px;font-size:16px;border-radius:8px}
.heroviz{display:grid;gap:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0 40px}
.stats div{border-top:2px solid var(--accent);padding-top:8px}.stats b{display:block;font:700 30px var(--display);font-variant-numeric:tabular-nums}.stats span{font-size:13px;color:var(--mut)}
.how ol{list-style:none;counter-reset:s;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.how li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px}
.how li::before{content:counter(s);font:700 13px var(--mono);color:var(--accent)}
.how li span{color:var(--mut);font-size:13.500px}
.formhead{margin:24px 0 16px}
.formgrid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.formgrid{grid-template-columns:minmax(0,1fr)}}
.formbar{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.pk{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;background:var(--surface2)}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid currentColor}.pill.ok{color:var(--grA)}
.drop{display:grid;gap:6px;justify-items:center;text-align:center;border:2px dashed var(--line);border-radius:10px;padding:28px 16px;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.flist{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:4px}
.flist li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12.500px}
.flist li span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
.flist .x{background:none;border:0;color:var(--mut);font-size:16px}
.proc{max-width:560px;margin:60px auto}
.psteps{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:10px}
.psteps li{display:flex;gap:10px;align-items:center;color:var(--mut)}
.psteps .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}
.psteps li.now{color:var(--fg)}.psteps li.now .dot{border-color:var(--accent)}
.psteps li.done{color:var(--fg)}.psteps li.done .dot{background:var(--accent);border-color:var(--accent)}
.pbar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}.pbar i{display:block;height:6px;width:0;background:var(--accent);transition:width .6s}
.rbanner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
/* ===== Estética espacial ===== */
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1}
.card,.side,.gc,.res,.how li{background:color-mix(in srgb,var(--surface) 90%,transparent)}
h2{font-family:var(--display);font-weight:700}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.02em;cursor:pointer}
.hero2{position:relative;overflow:hidden;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:72px max(16px,env(safe-area-inset-left,0px)) 210px;border-bottom:1px solid var(--line)}
.herotext{position:relative;z-index:2;max-width:860px}
.hero2 h1{font:800 clamp(34px,6vw,72px)/1.02 var(--display);letter-spacing:-.02em;margin:0 0 20px;text-wrap:balance}
.hero2 h1 em{font-style:normal;color:var(--cool)}
.hero2 .lede{font-size:18px;max-width:56ch;color:var(--mut);margin:0 0 28px}
.orb{position:absolute;right:-60px;top:40px;width:420px;height:420px;border-radius:50%;z-index:1;
  background:radial-gradient(circle at 50% 55%,#eaf6ff 0,#8cc8ff 9%,#3f8dff 26%,rgba(47,111,224,.35) 46%,rgba(47,111,224,0) 68%);filter:blur(2px);opacity:.85}
.planet{position:absolute;left:50%;bottom:-1180px;width:2400px;height:1300px;margin-left:-1200px;border-radius:50%;z-index:1;
  background:radial-gradient(ellipse at 50% 0,#182544 0,#0a1122 30%,#04060c 60%);box-shadow:0 -2px 0 rgba(140,200,255,.55),0 -18px 70px rgba(63,141,255,.35)}
@media (max-width:700px){.orb{width:240px;height:240px;right:-70px;top:10px;opacity:.6}}
@media (prefers-reduced-motion:no-preference){.orb{animation:breathe 7s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.06);opacity:1}}}
.btn.big{font-family:var(--display);letter-spacing:.04em;text-transform:uppercase}
.stats{margin-top:28px}
/* formulario por pestañas */
.ftabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 18px;border-bottom:1px solid var(--line)}
.ftab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--mut);display:flex;gap:8px;align-items:center;font-weight:600}
.ftab i{font:500 12px var(--mono);font-style:normal;border:1px solid currentColor;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.ftab[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.ftab.done i{background:var(--cool);color:var(--bg);border-color:var(--cool)}
.habs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.hab{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column}
.hab:hover{border-color:var(--cool)}
.hab[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
.hab .art{height:150px;background:radial-gradient(ellipse at 50% 120%,#1a2a52 0,#070b16 70%);color:var(--cool);display:grid;place-items:center;border-bottom:1px solid var(--line)}
.hab[aria-pressed="true"] .art{color:var(--accent)}
.hab .txt{padding:12px 14px 14px;display:grid;gap:6px}
.hab b{font:700 17px var(--display)}
.hab small{color:var(--mut);font-size:12.500px}
.hab .vals{display:flex;gap:6px;flex-wrap:wrap}
.hab .vals span{font:500 11.500px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.goal{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;color:inherit;font-size:16px;resize:vertical}
.fpanel{min-height:300px}
.fwide{max-width:560px}
/* resultado: interpretación */
.interp{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px;margin-bottom:14px}
@media (max-width:1000px){.interp{grid-template-columns:minmax(0,1fr)}}
.evi{display:grid;gap:10px;align-content:start}
.evi .lvl{font:800 40px/1 var(--display);letter-spacing:-.02em}
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.meter i{height:10px;border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.meter i.on{border-color:transparent}
.ana p{margin:0 0 8px;font-size:15px;line-height:1.55}
.ana ul{margin:4px 0 0;padding-left:18px}.ana li{margin-bottom:4px}
.ana .goalq{font-style:italic;color:var(--mut)}
.finds{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:18px}
.find{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:color-mix(in srgb,var(--surface) 90%,transparent);display:grid;gap:6px;align-content:start}
.find .tag{font:600 10.500px var(--mono);letter-spacing:.1em;display:flex;gap:6px;align-items:center}
.find .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.find b{font-size:15px}
.find p{margin:0;font-size:13.500px;color:var(--fg)}
.find small{color:var(--mut);font:500 11.500px var(--mono)}
.l3{color:var(--accent)}.l2{color:var(--grB)}.l1{color:var(--cool)}.l0{color:var(--mut)}
.find.f3{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.tops{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:18px}
.top{position:relative;border:1.5px solid var(--line);border-radius:14px;padding:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--surface2) 95%,transparent),color-mix(in srgb,var(--surface) 95%,transparent));text-align:left;display:grid;gap:8px;align-content:start}
.top:hover{border-color:var(--cool)}
.top .rk{font:800 44px/1 var(--display);color:var(--line);position:absolute;right:14px;top:10px}
.top .nm{font:700 20px var(--display);padding-right:44px}
.top .ti{font-size:12.500px;color:var(--mut)}
.top .wy{font-size:13px}
.gtag{display:inline-block;font:600 10.500px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--cool)}
.sech{font:700 13px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:22px 0 10px;display:flex;gap:10px;align-items:center}
.sech::after{content:"";flex:1;height:1px;background:var(--line)}
/* ===== v5: tipografía legible, landing centrada, tablero visual ===== */

function compute(){
  const act=NUMV.filter(k=>S.vars[k].on);
  const mat=S.vars.mat.on?S.vars.mat.val:null;
  const sc=mat?(T.find(t=>t.fuel===mat)||{}).ph:null;
  const names=S.customs.map(c=>c.name);
  const rows=INV.map((inv,idx)=>{
    let tests=TI[idx];
    const R={idx,inv,grade:'D',d:null,why:[],missing:[],near:null,env:{},nt:tests.length};
    if(!tests.length){R.why.push('Ficha sin tabla de pruebas: solo texto y publicaciones.');return R;}
    const phases=[...new Set(tests.map(t=>t.ph))];
    if(sc&&!phases.includes(sc)){R.why.push('Estudia '+phases.map(p=>PH[p]).join(' y ')+', no '+PH[sc]+'.');return R;}
    if(sc)tests=tests.filter(t=>t.ph===sc);
    const has=act.filter(k=>tests.some(t=>t[k][0]!=null));
    R.missing=act.filter(k=>!has.includes(k)).map(k=>VM[k].label).concat(names);
    if(!has.length){R.why.push('No registra ninguna de tus variables numéricas.');return R;}
    const out=[];
    has.forEach(k=>{
      const ts=tests.filter(t=>t[k][0]!=null);
      const lo=Math.min(...ts.map(t=>t[k][0])),hi=Math.max(...ts.map(t=>t[k][1]));
      R.env[k]=[lo,hi];
      const v=S.vars[k].val,s=S.vars[k].sigma||1;
      if(v<lo-TOL*s||v>hi+TOL*s)out.push(VM[k].label+' ('+VM[k].unit+'): tu valor '+f2(v)+' está fuera de lo probado ['+f2(lo)+', '+f2(hi)+']');
    });
    const matTested=!mat||tests.some(t=>t.fuel===mat);
    let best=null;
    tests.forEach(t=>{
      let sum=0,n=0;
      has.forEach(k=>{if(t[k][0]==null)return;const v=S.vars[k].val,s=S.vars[k].sigma||1;
        const e=v<t[k][0]?t[k][0]-v:v>t[k][1]?v-t[k][1]:0;sum+=(e/s)**2;n++;});
      if(!n)return;
      const d=Math.sqrt(sum)+(mat&&t.fuel!==mat?PEN:0);
      if(!best||d<best.d)best={d,t};
    });
    R.d=best?best.d:null;R.near=best?best.t:null;
    R.why=out.slice();
    if(!matTested)R.why.push('Material no probado: '+esc(mat)+' no aparece en sus pruebas.');
    if(out.length||!matTested)R.grade='C';
    else if(R.d<=UMBRAL_A&&!R.missing.length)R.grade='A';
    else{R.grade='B';
      if(R.missing.length)R.why.push('No registra: '+R.missing.join(', ')+'.');
      else R.why.push('Dentro de lo probado, pero la prueba más cercana está a d = '+f2(R.d)+'.');}
    if(R.grade==='A')R.why.push('Prueba muy cercana: '+R.near.id+' (fila '+R.near.row+').');
    return R;
  });
  const ord={A:0,B:1,C:2,D:3};
  const uo={exact:0,rel:1,other:2,none:3};rows.forEach(r=>{r.use=useMatch(r.inv)});
  rows.sort((a,b)=>ord[a.grade]-ord[b.grade]||(a.use?uo[a.use.m]-uo[b.use.m]:0)||a.missing.length-b.missing.length||(a.d??99)-(b.d??99));
  const cnt={A:0,B:0,C:0,D:0};rows.forEach(r=>cnt[r.grade]++);
  // pruebas que cubren el escenario completo
  let pool=T.filter(t=>!t.camp&&(!sc||t.ph===sc));
  let full=0,fullInv=new Set();
  if(!names.length&&act.length){
    pool.forEach(t=>{
      if(!act.every(k=>t[k][0]!=null&&S.vars[k].val>=t[k][0]-TOL*S.vars[k].sigma&&S.vars[k].val<=t[k][1]+TOL*S.vars[k].sigma))return;
      if(mat&&t.fuel!==mat)return;full++;fullInv.add(t.i);});
  }
  const partial=pool.filter(t=>act.some(k=>t[k][0]!=null)).length;
  return {rows,cnt,full,fullInv,act,mat,sc,partial,poolN:pool.length};
}

const bi=(v,e)=>{let r=0;for(let i=0;i<e.length-1;i++)if(v>=e[i])r=i;return r};
const blab=(e,i,u)=>{const a=e[i],b=e[i+1];return (a<=0?'<'+f2(b):b>=99?'≥'+f2(a):f2(a)+'–'+f2(b))+' '+u};
function heat(phase,xk,yk){
  const ex=VM[xk].edges,ey=VM[yk].edges,nx=ex.length-1,ny=ey.length-1;
  const cells=Array.from({length:nx},()=>Array.from({length:ny},()=>({n:0,t:[]})));
  let nox=0,noy=0,both=0,all=0;
  T.filter(t=>t.ph===phase&&!t.camp).forEach(t=>{
    all++;const hx=t[xk][0]!=null,hy=t[yk][0]!=null;
    if(!hx)nox++;if(!hy)noy++;
    if(hx&&hy){both++;const x=bi((t[xk][0]+t[xk][1])/2,ex),y=bi((t[yk][0]+t[yk][1])/2,ey);cells[x][y].n++;cells[x][y].t.push(t);}
  });
  return {cells,nx,ny,ex,ey,nox,noy,both,all};
}
function gapInfo(phase,xk,yk){
  const H=heat(phase,xk,yk);
  const v=S.vars,ok=v[xk].on&&v[yk].on;
  if(!ok)return {H,ok:false};
  const cx=bi(v[xk].val,H.ex),cy=bi(v[yk].val,H.ey),n=H.cells[cx][cy].n;
  let near=null;
  H.cells.forEach((col,x)=>col.forEach((c,y)=>{if(c.n){const d=Math.hypot(x-cx,y-cy);if(!near||d<near.d)near={d,x,y,n:c.n};}}));
  return {H,ok:true,cx,cy,n,near};
}
function renderHeat(el,phase,xk,yk,small){

  const nodata=H.both===0;

  for(let x=0;x<H.nx;x++)for(let y=0;y<H.ny;y++){

    else{fill='var(--surface)';dash='4 3';}

    if(c.n&&!small&&cw>34)s+=`<text x="${px+cw/2}" y="${py+ch/2+4}" text-anchor="middle" font-size="11" class="mono" fill="${op>.6?'var(--accent-ink)':'var(--fg)'}" pointer-events="none">${c.n}</text>`;

  for(let y=0;y<H.ny;y++)s+=`<text x="${ml-6}" y="${mt+(H.ny-1-y)*ch+ch/2+3}" text-anchor="end" font-size="${fs}" fill="var(--mut)">${blab(H.ey,y,'').trim()}</text>`;
  s+=`<text x="${ml+(W-ml-mr)/2}" y="${Hh-6}" text-anchor="middle" font-size="11.5" fill="var(--fg)">${VM[xk].label} (${VM[xk].unit})</text>`;

  if(g.ok){
    const vx=S.vars[xk].val,vy=S.vars[yk].val;
    const fx=(i,v,e)=>{const lo=e[i],hi=Math.min(e[i+1],lo+(e[i+1]>=99||lo<=0&&false?1:1e9));return 0};

    s+=`<g pointer-events="none"><line x1="${ml}" x2="${W-mr}" y1="${cyp}" y2="${cyp}" stroke="var(--fg)" stroke-dasharray="3 3" opacity=".75"/><line y1="${mt}" y2="${Hh-mb}" x1="${cxp}" x2="${cxp}" stroke="var(--fg)" stroke-dasharray="3 3" opacity=".75"/><circle cx="${cxp}" cy="${cyp}" r="7" fill="none" stroke="var(--fg)" stroke-width="2.5"/><circle cx="${cxp}" cy="${cyp}" r="2.500" fill="var(--fg)"/></g>`;
  }

function axisScores(idx,axes){
  const sc=C.sc;let tests=TI[idx];
  const phases=[...new Set(tests.map(t=>t.ph))];
  const bad=!tests.length||(sc&&!phases.includes(sc));
  if(!bad&&sc)tests=tests.filter(t=>t.ph===sc);
  return axes.map(a=>{
    if(a.kind==='use'){const m=useMatch(INV[idx]);return{s:m.s,note:m.m==='exact'?'declara tu hábitat':m.m==='rel'?'declara '+ENVL[m.u.env]:m.m==='other'?'declara otro uso: '+ENVL[m.u.env]:'no declara un uso',miss:m.m==='none'}}
    if(bad)return{s:0,note:!TI[idx].length?'sin tabla de pruebas':'estudia otro tipo de combustible',miss:true};
    if(a.kind==='cus')return{s:0,note:'sin evidencia',miss:true};
    if(a.kind==='cat'){const ok=tests.some(t=>t.fuel===a.val);return{s:ok?100:0,note:ok?'probado':'no probado',miss:false}}
    const ts=tests.filter(t=>t[a.key][0]!=null);
    if(!ts.length)return{s:0,note:'no la registra',miss:true};
    let best=null;
    ts.forEach(t=>{const v=a.val,e=v<t[a.key][0]?t[a.key][0]-v:v>t[a.key][1]?v-t[a.key][1]:0;if(!best||e<best.e)best={e,t}});
    const r=best.t[a.key];
    return{s:Math.round(100*Math.max(0,1-best.e/(3*a.sigma))),note:'más cercano '+(r[0]===r[1]?f2(r[0]):f2(r[0])+'–'+f2(r[1]))+' '+a.unit,miss:false};
  });
}

let G=null;
function buildGraph(){
  const nodes=[],links=[],id2=new Map();
  INV.forEach((inv,i)=>{const n={id:inv.id,type:'inv',label:inv.ac,r:7+Math.min(14,Math.sqrt(inv.n)*.9),x:0,y:0,vx:0,vy:0};nodes.push(n);id2.set(inv.id,n)});
  NUMV.forEach(k=>{const n={id:'v:'+k,type:'var',label:VM[k].label,r:9,x:0,y:0,vx:0,vy:0};nodes.push(n);id2.set(n.id,n)});
  const mi={};T.forEach(t=>{(mi[t.fuel]=mi[t.fuel]||new Set()).add(t.i)});
  Object.entries(mi).filter(([k,s])=>s.size>=2).forEach(([k,s])=>{const n={id:'m:'+k,type:'mat',label:k,r:5,x:0,y:0,vx:0,vy:0};nodes.push(n);id2.set(n.id,n);s.forEach(i=>links.push({a:INV[i].id,b:n.id,t:'mat'}))});
  const seen=new Set();
  INV.forEach(inv=>inv.rel.forEach(r=>{if(!id2.has(r))return;const k=[inv.id,r].sort().join('|');if(seen.has(k))return;seen.add(k);links.push({a:inv.id,b:r,t:'rel'})}));
  const hw={};INV.forEach(inv=>(inv.hw||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(h=>{(hw[h]=hw[h]||[]).push(inv.id)}));
  Object.entries(hw).filter(([h,l])=>l.length>=2&&l.length<=6).forEach(([h,l])=>{for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++){const k=[l[i],l[j]].sort().join('|');if(seen.has(k))continue;seen.add(k);links.push({a:l[i],b:l[j],t:'hw',h})}});
  NUMV.forEach(k=>INV.forEach((inv,i)=>{if(TI[i].some(t=>t[k][0]!=null))links.push({a:inv.id,b:'v:'+k,t:'var'})}));
  nodes.forEach((n,i)=>{const a=i/nodes.length*Math.PI*2;n.x=480+Math.cos(a)*230;n.y=300+Math.sin(a)*170});
  links.forEach(l=>{l.s=id2.get(l.a);l.e=id2.get(l.b)});
  G={nodes,links,id2,alpha:1};
  for(let i=0;i<320;i++)tick();
}
function tick(){
  const {nodes,links}=G;
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01;const d=Math.sqrt(d2);const f=2600/d2;
    dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;}
  links.forEach(l=>{const dx=l.e.x-l.s.x,dy=l.e.y-l.s.y,d=Math.sqrt(dx*dx+dy*dy)||1;const len=l.t==='var'?150:l.t==='mat'?70:60;const f=(d-len)*.02*(l.t==='var'?.35:1);
    l.s.vx+=dx/d*f;l.s.vy+=dy/d*f;l.e.vx-=dx/d*f;l.e.vy-=dy/d*f;});
  nodes.forEach(n=>{n.vx+=(480-n.x)*.004;n.vy+=(300-n.y)*.006;if(n.drag)return;n.x+=n.vx*.5;n.y+=n.vy*.5;n.vx*=.6;n.vy*=.6;n.x=Math.max(30,Math.min(930,n.x));n.y=Math.max(24,Math.min(576,n.y))});
}

function colorOf(g){return {A:'var(--gA)',B:'var(--gB)',C:'var(--gC)',D:'var(--gD)'}[g]}
function drawGraph(){
  if(!G)buildGraph();
  const grade={};C.rows.forEach(r=>grade[r.inv.id]=r.grade);
  const sel=S.gsel,nb=new Set();
  if(sel)G.links.forEach(l=>{if(l.a===sel)nb.add(l.b);if(l.b===sel)nb.add(l.a)});
  const dim=id=>sel&&id!==sel&&!nb.has(id);
  let s='';
  G.links.forEach(l=>{const on=sel&&(l.a===sel||l.b===sel);const op=sel?(on?.9:.08):(l.t==='var'?.18:l.t==='mat'?.22:.5);
    s+=`<line data-a="${l.a}" data-b="${l.b}" x1="${l.s.x}" y1="${l.s.y}" x2="${l.e.x}" y2="${l.e.y}" stroke="${on?'var(--accent)':'var(--mut)'}" stroke-width="${l.t==='rel'?1.8:1}" ${l.t==='hw'?'stroke-dasharray="4 3"':''} opacity="${op}"/>`});
  G.nodes.forEach(n=>{
    const o=dim(n.id)?.2:1,isel=sel===n.id;
    if(n.type==='inv'){const c=colorOf(grade[n.id]);s+=`<g class="gn" data-id="${n.id}" opacity="${o}" style="cursor:pointer"><circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${c}" fill-opacity=".85" stroke="${isel?'var(--fg)':'var(--bg)'}" stroke-width="${isel?3:1.5}"/><text x="${n.x}" y="${n.y-n.r-4}" text-anchor="middle" font-size="10.5" fill="var(--fg)">${esc(n.label)}</text></g>`}
    else if(n.type==='var')s+=`<g class="gn" data-id="${n.id}" opacity="${o}" style="cursor:pointer"><rect x="${n.x-8}" y="${n.y-8}" width="16" height="16" transform="rotate(45 ${n.x} ${n.y})" fill="var(--accent)" stroke="${isel?'var(--fg)':'var(--bg)'}" stroke-width="2"/><text x="${n.x}" y="${n.y-14}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fg)">${n.label}</text></g>`;
    else s+=`<g class="gn" data-id="${n.id}" opacity="${o}" style="cursor:pointer"><circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="none" stroke="var(--mut)" stroke-width="1.5"/><text x="${n.x+8}" y="${n.y+3}" font-size="9.5" fill="var(--mut)">${esc(n.label)}</text></g>`;
  });
  const svg=$('#gsvg');svg.innerHTML=s;
  svg.querySelectorAll('.gn').forEach(g=>{
    g.addEventListener('pointerdown',e=>{
      const n=G.id2.get(g.dataset.id);n.drag=true;let moved=false;svg.setPointerCapture(e.pointerId);
      const mv=ev=>{moved=true;const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());n.x=q.x;n.y=q.y;for(let i=0;i<3;i++)tick();drawGraph()};
      const up=()=>{n.drag=false;svg.removeEventListener('pointermove',mv);svg.removeEventListener('pointerup',up);if(!moved){S.gsel=S.gsel===n.id?null:n.id;drawGraph()}};
      svg.addEventListener('pointermove',mv);svg.addEventListener('pointerup',up);
    });
  });
  panel();
}
function panel(){
  const sel=S.gsel,el=$('#gpanel');if(!el)return;

  const n=G.id2.get(sel);
  const ls=G.links.filter(l=>l.a===sel||l.b===sel).map(l=>({o:l.a===sel?l.e:l.s,t:l.t}));

}
function procHTML(){
  return `<section class="proc card"><h2>Preparando tu análisis</h2><p class="note" style="margin:0 0 14px">${S.files.length?S.files.length+' archivo(s) y el paquete de fuego.':'Paquete de fuego en microgravedad.'}</p><ol class="psteps">${STEPS.map((s,i)=>`<li id="ps${i}"><span class="dot"></span>${s}</li>`).join('')}</ol><div class="pbar"><i id="pb"></i></div></section>`;
}
function resultHTML(){
  return `<div class="rbanner"><button class="btn ghost sm" id="edit">← Editar mi caso</button><span class="note">${esc(scenarioText())}</span></div><div class="layout"><aside class="side" id="side" aria-label="Escenario"></aside><main id="main" aria-live="polite"></main></div><p class="note" style="margin-top:28px">Prototipo con datos reales de las 24 investigaciones de Combustion Science de NASA PSI. Pesos, escalas y umbrales son propuestas de trabajo. Prometeo compara condiciones probadas y señala huecos; no predice si un material arde. Solo O₂, presión, flujo y gravedad tienen datos; cualquier otra variable se marca «sin evidencia».</p>`;
}
function keepGoal(){const g=document.getElementById('goal');if(g)S.goal=g.value.trim()}
function showStage(){
  const el=$('#stage');renderTabs();
  if(S.stage==='landing'){
    el.innerHTML=landingHTML();
    $('#cta').onclick=()=>{S.step=0;setStage('form')};
    $('#cta2').onclick=()=>{S.tab='escenario';C=compute();setStage('result')};
  }else if(S.stage==='form'){
    C=compute();el.innerHTML=formHTML();
    document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{keepGoal();S.step=+b.dataset.step;showStage()});
    $('#back').onclick=()=>{keepGoal();if(S.step===0)setStage('landing');else{S.step--;showStage()}};
    $('#next').onclick=()=>{keepGoal();if(S.step===3)setStage('proc');else{S.step++;showStage();window.scrollTo({top:0})}};
    if(S.step===0)document.querySelectorAll('[data-hab]').forEach(b=>b.onclick=()=>{S.hab=b.dataset.hab;const p=PRESETS.find(x=>x.id===S.hab);if(p)setPreset(p);showStage()});
    if(S.step===1)side();
    if(S.step===2)document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('#goal').value=b.dataset.q;S.goal=b.dataset.q});
    if(S.step===3){
      const inp=$('#files'),drop=$('#drop');
      const bindF=()=>document.querySelectorAll('[data-rmf]').forEach(b=>b.onclick=()=>{S.files.splice(+b.dataset.rmf,1);$('#flist').innerHTML=filesHTML();bindF()});
      const add=list=>{[...list].forEach(f=>S.files.push({name:f.name,size:f.size}));$('#flist').innerHTML=filesHTML();bindF()};
      inp.onchange=()=>{add(inp.files);inp.value=''};
      ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
      ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
      drop.addEventListener('drop',e=>add(e.dataTransfer.files));bindF();
    }
  }else if(S.stage==='proc'){
    el.innerHTML=procHTML();
    let i=0;const total=STEPS.length;
    const run=()=>{
      if(i>0){const p=$('#ps'+(i-1));if(p)p.classList.add('done')}
      $('#pb').style.width=(i/total*100)+'%';
      if(i>=total){setTimeout(()=>{S.tab='escenario';S.sel=null;setStage('result')},350);return}
      const c=$('#ps'+i);if(c)c.classList.add('now');i++;setTimeout(run,600);
    };
    run();
  }else{
    C=compute();el.innerHTML=resultHTML();side();renderMain();
    $('#edit').onclick=()=>{S.step=0;setStage('form')};
  }
}
/* cielo: nebulosa suave + estrellas en tres capas (estático, con semilla) */
(function(){const c=document.getElementById('stars');if(!c||!c.getContext)return;
  const draw=()=>{const d=Math.min(2,window.devicePixelRatio||1),w=innerWidth,h=innerHeight;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);
    let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;
    const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#02040a');g.addColorStop(1,'#050a18');x.fillStyle=g;x.fillRect(0,0,w,h);
    x.globalCompositeOperation='lighter';
    const cols=['40,90,210','20,120,170','70,60,170','255,130,60'];
    for(let i=0;i<10;i++){const cx=r()*w,cy=r()*h,rad=220+r()*Math.max(w,h)*.38,col=cols[i%4],al=i%4===3?.035:.07;
      const n=x.createRadialGradient(cx,cy,0,cx,cy,rad);n.addColorStop(0,`rgba(${col},${al})`);n.addColorStop(1,`rgba(${col},0)`);x.fillStyle=n;x.fillRect(0,0,w,h);}
    x.globalCompositeOperation='source-over';
    for(let i=0;i<Math.round(w*h/2600);i++){x.fillStyle=`rgba(${205+Math.round(r()*50)},${215+Math.round(r()*40)},255,${.18+r()*.5})`;x.fillRect(r()*w,r()*h,r()<.5?.7:1.1,r()<.5?.7:1.1)}
    for(let i=0;i<Math.round(w*h/26000);i++){const px=r()*w,py=r()*h,z=.9+r()*.9;x.shadowColor='rgba(170,205,255,.9)';x.shadowBlur=6;x.fillStyle='rgba(240,246,255,.95)';x.beginPath();x.arc(px,py,z,0,6.283);x.fill()}
    x.shadowBlur=0;
    for(let i=0;i<5;i++){const px=r()*w,py=r()*h*.7,l=7+r()*7;x.strokeStyle='rgba(220,235,255,.55)';x.lineWidth=1;x.beginPath();x.moveTo(px-l,py);x.lineTo(px+l,py);x.moveTo(px,py-l);x.lineTo(px,py+l);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(px,py,1.6,0,6.283);x.fill()}};
  draw();let t;addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(draw,150)});})();
$('#home').onclick=()=>setStage('landing');

document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').innerHTML=''});

if(TABS.some(t=>t[0]===h0)){S.tab=h0;S.stage='result'}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(S.stage==='result'&&TABS.some(t=>t[0]===h)&&h!==S.tab){S.tab=h;renderTabs();renderMain()}});
showStage();
